name: Testes

on:
  push:
    branches:
      - main
      - testes
  pull_request:
    branches:
      - main
      - testes

jobs:
  build-e-teste:
    runs-on: ubuntu-latest

    steps:
      - name: Maquina GitHub
        uses: actions/checkout@v4

      - name: Instalar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Rodar os Testes
        run: mvn test